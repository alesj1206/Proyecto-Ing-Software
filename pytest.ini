[pytest]
DJANGO_SETTINGS_MODULE = scoutly.settings
python_files = tests.py test_*.py
markers =
    lento: descarga o ejecuta modelos reales o sale a internet (minutos)
filterwarnings =
    # EMAIL_* → MAILERS: se migra con las notificaciones (Fase 3), anotado en el ledger de la Fase 1.
    ignore:The EMAIL_.* setting is deprecated:DeprecationWarning
    ignore:The EMAIL_.* setting is deprecated
