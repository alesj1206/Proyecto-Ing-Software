<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="chainGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A324C" />
      <stop offset="1" stop-color="#0CBB4E" />
    </linearGradient>
  </defs>

  <!-- brújula: cuatro puntas -->
  <path d="M32 4 L38 26 L32 32 L26 26 Z" fill="#1A324C" />
  <path d="M32 60 L26 38 L32 32 L38 38 Z" fill="#1A324C" />
  <path d="M4 32 L26 26 L32 32 L26 38 Z" fill="#1A324C" />
  <path d="M46 26 L32 32 L38 38 L52 40 Z" fill="#0CBB4E" />

  <!-- dial con marcas -->
  <circle cx="32" cy="32" r="15" fill="#FFFFFF" stroke="#1A324C" stroke-width="2.5" />
  <line x1="32" y1="19" x2="32" y2="22" stroke="#1A324C" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="42" x2="32" y2="45" stroke="#1A324C" stroke-width="2" stroke-linecap="round" />
  <line x1="19" y1="32" x2="22" y2="32" stroke="#1A324C" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="32" x2="45" y2="32" stroke="#1A324C" stroke-width="2" stroke-linecap="round" />

  <!-- check -->
  <path d="M26 32 L30 36 L39 26" stroke="#0CBB4E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- destello -->
  <path d="M44 12 L46 18 L52 20 L46 22 L44 28 L42 22 L36 20 L42 18 Z" fill="#0CBB4E" />

  <!-- eslabón -->
  <g transform="translate(32 50)">
    <rect x="-11" y="-5" width="12" height="10" rx="5" fill="none" stroke="url(#chainGradient)" stroke-width="3" />
    <rect x="-1" y="-5" width="12" height="10" rx="5" fill="none" stroke="url(#chainGradient)" stroke-width="3" />
  </g>
</svg>
