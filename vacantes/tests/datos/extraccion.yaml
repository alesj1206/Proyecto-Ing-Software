    Medellín

    En Nutrium, creemos en el talento joven como motor de aprendizaje, innovación y crecimiento. Por eso, buscamos a una persona en etapa de práctica, con interés por aprender y desarrollarse en el área financiero. Queremos que este rol aporte al seguimiento de información clave para la compañía, fortalezca sus habilidades analíticas y crezca junto a un equipo que acompaña, reta y construye.

    📍 Lugar de trabajo: Medellín
    🏢 Modalidad: Presencial

    🎯 Objetivo del cargo
    Apoyar al área financiera en la consolidación, análisis y generación de informes relacionados con costos, márgenes, gastos y rentabilidad, contribuyendo a la toma de decisiones y al seguimiento financiero de las operaciones de Nutrium.

    🔍 Responsabilidades principales

    Descargar, consolidar y generar informes de costos de producción de las diferentes plantas de Nutrium.
    Apoyar la apertura de costos de las referencias negociadas y realizar ajustes que contribuyan al seguimiento de la rentabilidad de los contratos.
    Elaborar informes de margen bruto por SKU para la compañía.
    Acompañar la elaboración y análisis de informes de gastos.
    Apoyar la gestión de información financiera, asegurando orden, precisión y oportunidad en los reportes.
    Participar en actividades del área financiera, fortaleciendo sus conocimientos prácticos y su criterio analítico.

    💡 Competencias y habilidades deseadas

    Ser estudiante de Ingeniería Administrativa, Administración de Empresas con enfoque financiero, Ingeniería Financiera o programas afines.
    Contar con aval de la institución educativa para realizar práctica bajo contrato de aprendizaje.
    Interés por aprender y crecer en el área financiera.
    Habilidades analíticas y capacidad para trabajar con información numérica.
    Organización, atención al detalle y orientación al cumplimiento.
    Manejo básico o intermedio de herramientas ofimáticas, especialmente Excel.
    Disponibilidad para realizar la práctica de lunes a viernes en horario de oficina.

    📄 Tipo de contrato
    Contrato fijo especial, con acompañamiento del equipo y oportunidad de fortalecer tus conocimientos en un entorno empresarial dinámico.

    🌱 Beneficios y bienestar
    Únete a nuestro equipo y disfruta de un entorno de trabajo colaborativo con beneficios como servicio de alimentación, gimnasio, espacios de coworking, horarios flexibles y jornada corta los viernes. ¡Da el siguiente paso en tu carrera profesional con nosotros!

    🌿 Si te motiva hacer parte de una organización que promueve el crecimiento, te invitamos a postularte y ser parte de Nutrium.
