    Formación académica: técnica o tecnología en áreas administrativas.

    Funciones específicas:

    - Conocer los productos y servicios de la organización.

    - Asesorar a los clientes de manera objetiva, identificando y atendiendo sus necesidades.

    - Mantener contacto continuo con los clientes y ofrecer un excelente servicio posventa.

    - Identificar, diligenciar y reportar al jefe inmediato las oportunidades de mejoramiento expresadas por los clientes.

    - Recibir y gestionar las llamadas relacionadas con solicitudes de información sobre cirugías y servicios de otras unidades de negocio, dando respuesta oportuna según los procedimientos establecidos.

    Conocimientos:

    - Atención al usuario con orientación a la calidad.

    - Ética y valores.

    - Compromiso con la organización.

    - Trabajo en equipo.

    Salario: $1.810.000 + prestaciones de ley.

    Horarios: lunes a viernes de 8:00 a. m. a 5:00 p. m. y dos sábados al mes de 8:00 a. m. a 11:00 a. m., con una hora de almuerzo.

    Tipo de contrato: indefinido.

    Lugar de trabajo: Envigado.

    Proceso de Selección

    Tu próxima oportunidad laboral puede estar a pocos pasos. Para postularte:

    Haz clic en el botón "Postularme".
    Inicia sesión o crea tu cuenta en Magneto, registra tu hoja de vida y responde las preguntas del proceso.
    Revisa tu correo electrónico para conocer el estado de tu postulación.
    Si avanzas, completa las pruebas y/o entrevistas solicitadas.

    El equipo del Servicio de Empleo Comfama evaluará tu perfil, si se ajusta a la vacante y pasas los filtros, lo enviará a la empresa y ellos te contactarán para continuar el proceso. Recuerda que no debes pagar para participar de procesos de selección. Así dirás #MeProtejodelfraude

    Sobre Nosotros

    El Servicio de Empleo Comfama es la plataforma de intermediación que conecta el talento de las personas y las necesidades de las empresas. Como agencia transnacional, presta el servicio para empresas ubicadas en Antioquia, y en el extranjero que requieren talento colombiano. Somos prestador autorizado Resolución 0017 del 14 de enero de 2026 del Servicio Público de Empleo.
