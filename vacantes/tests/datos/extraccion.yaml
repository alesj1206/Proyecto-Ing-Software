    SENCO LATIN AMERICA S.A.S busca incorporar a su equipo de trabajo un Asistente Contable comprometido con la excelencia y el orden financiero. Esta es una oportunidad ideal para profesionales que deseen fortalecer su trayectoria en una organización dinámica, asumiendo un rol clave para garantizar la precisión y transparencia de nuestra información económica.

    El candidato seleccionado tendrá como misión principal asegurar que los registros financieros de la compañía se mantengan actualizados, organizados y debidamente respaldados. Para lograrlo, será responsable de registrar de manera sistemática y diaria las transacciones comerciales, incluyendo compras, ventas, pagos y cobros en nuestro software contable. Asimismo, deberá verificar rigurosamente que cada movimiento cuente con su respectivo soporte físico o digital, garantizando la integridad de la información.

    Dentro de sus funciones, realizará conciliaciones periódicas entre los libros contables internos y los extractos bancarios, asegurando la coherencia en las cuentas por pagar y cobrar. Brindará un apoyo fundamental en la gestión de obligaciones fiscales, el cálculo de impuestos, retenciones y el soporte en la elaboración de estados financieros bajo la supervisión del contador público. Adicionalmente, será responsable de la custodia y clasificación del archivo financiero, facilitando la eficiencia en auditorías y revisiones.

    Buscamos tecnólogos con al menos 12 meses de experiencia comprobable en áreas contables. Valoramos la capacidad de análisis, la atención al detalle y el compromiso con el cumplimiento de los procesos internos.

    Ofrecemos una vinculación laboral con jornada en horario diurno, ubicada en la Vereda Belén Km. 38+200 Metros Autopista Medellín-Bogotá, en el municipio de Marinilla, Antioquia. La remuneración salarial será definida según el perfil y la experiencia del candidato. Si buscas un entorno profesional donde tu trabajo impacte directamente en la salud financiera de la empresa, te invitamos a formar parte de nuestro equipo.

    Objetivo del cargo

    El objetivo principal de un auxiliar contable es garantizar que la información financiera y económica de una empresa sea precisa, ordenada, actualizada y esté debidamente respaldada

    Funciones del cargo

    • Registrar operaciones: Ingresar de forma sistemática y diaria las transacciones comerciales, como compras, ventas, pagos y cobros, en el software contable de la empresa.
    • Verificar soportes: Comprobar que cada movimiento contable cuente con su respectivo documento físico o digital válido (facturas, recibos, comprobantes).
    • Realizar conciliaciones: Cruzar la información de los libros contables internos con los extractos bancarios y cuentas por pagar o cobrar para evitar diferencias.
    • Apoyar en obligaciones fiscales y reportes: Organizar la información para el cálculo de impuestos, retenciones, nómina y la elaboración de estados financieros bajo la supervisión de un contador público.
    • Mantener el archivo al día: Custodiar y clasificar la documentación financiera para facilitar las auditorías internas o revisiones de entidades de control
