    Importante empresa ubicada en Medellín, solicita para su equipo de trabajo, personal con experiencia mínima de cinco (5) años para desempeñar el cargo de Desarrollador/a de negocios Salesforce.

    Formación académica: Profesional en administración, ciencias sociales o ingeniería.

    Funciones específicas:

    -Mantener con rigor el CRM que permita la visibilidad y realidad de la cuenta, oportunidades y contactos a la compañía y su líder directo.

    -Investigar y analizar el mercado objetivo para identificar nuevas oportunidades de negocio que se alineen con las soluciones de la empresa.

    -Identificar y prospectar activamente empresas en sectores objetivo, enfocándose en los perfiles de buyer persona más relevantes (Directores de TI, Infraestructura, Transformación Digital, etc.).

