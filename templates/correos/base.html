<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoutly</title></head>
<body style="margin:0;padding:0;background:#f5f5f9;font-family:Arial,Helvetica,sans-serif;color:#1a324c;">
<div style="display:none;max-height:0;overflow:hidden;">{% block anticipo %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f9;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;">
    <tr><td bgcolor="#6a35c9" align="center" style="padding:32px 24px;background:#6a35c9;background-image:linear-gradient(135deg,#9140fe 0%,#1a324c 100%);color:#ffffff;">
      <p style="margin:0 0 18px;font-size:18px;font-weight:bold;letter-spacing:.3px;">🧭 Scoutly</p>
      {% block destacado %}{% endblock %}
      <h1 style="margin:10px 0 0;font-size:24px;line-height:1.3;color:#ffffff;">{% block titulo %}{% endblock %}</h1>
      <p style="margin:10px 0 0;font-size:15px;line-height:1.5;color:#E9E2FB;">{% block bajada %}{% endblock %}</p>
    </td></tr>
    {% block contenido %}{% endblock %}
    <tr><td align="center" style="padding:20px 24px 30px;">
      <table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#0a9e41" style="border-radius:10px;background:#0a9e41;">
        <a href="{{ url_accion }}" style="display:inline-block;padding:15px 34px;font-size:17px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ texto_boton }} →</a>
      </td></tr></table>
      {% block tras_boton %}{% endblock %}
    </td></tr>
    <tr><td style="padding:16px 24px;background:#f9fafb;font-size:12px;line-height:1.5;color:#6b7280;text-align:center;">
      {% block pie %}{% endblock %}
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
